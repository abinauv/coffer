name: Release

# Tag a version, get installers for all three platforms plus a SHA-256 checksum file and
# a signed build-provenance attestation for every file attached.
#
# The builds are unsigned (SECURITY.md, "Known gaps"), so the operating system cannot vouch
# for a download. Two things here can, and neither is optional:
#   - SHA256SUMS.txt, generated from the artefacts that are actually attached, which says
#     a file arrived intact;
#   - the attestation, signed by Sigstore for this workflow run, which says the file was
#     built by this workflow from the tagged commit. The checksum file sits on the same
#     release page as the installers, so it cannot say that on its own.
#
# TODO (open hardening item): pin every `uses:` below to a full 40-character commit SHA.
# The reasoning is in ci.yml's copy of this note, and it applies with more force here,
# because this is the workflow that holds `contents: write` and puts binaries on a
# download page. The form is
#
#     uses: actions/checkout@<the 40-character sha that v7.0.0 points at>  # v7.0.0
#
# Left undone in this pass because the SHAs have to be read off the upstream
# repositories, and an invented one breaks every release at once. `actions/attest` in the
# `release` job was added pinned, its SHA read off the upstream v4.2.2 tag. The references
# still to pin, all eight of them:
#   - actions/checkout@v7          x3  (`verify`, the `build` matrix, `release`)
#   - actions/setup-node@v7        x3  (`verify`, the `build` matrix, `release`)
#   - actions/upload-artifact@v7   x1  (the `build` matrix)
#   - actions/download-artifact@v8 x1  (`release`)

on:
  push:
    tags:
      - 'v*'
  # Rehearse the release path without cutting a tag. Dispatched from a branch, the
  # verify -> build -> upload chain runs in full and leaves real installers attached to
  # the workflow run, which is the only way to learn that packaging broke before a
  # version number has been spent on it. Nothing is published: the `release` job below
  # refuses to run outside a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag push does not run the CI workflow, so re-run the correctness gate here. A
  # release that fails its own test suite should never reach a download page.
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # .nvmrc, the same file ci.yml and a contributor's `nvm use` read. The Node
          # version is written down once, so a release cannot be built on a different one
          # than main was tested on.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  build:
    name: Package ${{ matrix.artefact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform that can build should still produce its artefacts, so a single
      # broken runner is one visible failure rather than four.
      fail-fast: false
      matrix:
        include:
          - artefact: linux-x64
            os: ubuntu-latest
            platform: --linux
            arch: --x64
          - artefact: windows-x64
            os: windows-latest
            platform: --win
            arch: --x64
          - artefact: macos-arm64
            os: macos-latest
            platform: --mac
            arch: --arm64
          # Each macOS architecture is built on its own runner rather than cross-built,
          # because @node-rs/argon2 ships its binary in a per-architecture optional
          # dependency and npm only installs the one matching the host. `macos-15-intel`
          # is GitHub's x64 macOS image. If it is ever retired, the alternatives are to
          # move this label to whatever replaces it, or to build both slices on the arm64
          # runner after pulling in @node-rs/argon2-darwin-x64 explicitly.
          - artefact: macos-x64
            os: macos-15-intel
            platform: --mac
            arch: --x64
    env:
      # Never pick up a signing identity from a runner keychain. Builds are unsigned by
      # decision, not by accident, and an accidentally-signed artefact would not match
      # what a contributor can reproduce locally.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # As in `verify`: .nvmrc, so there is one version to change and not four.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify native modules under Electron
        run: npm run native:verify

      - name: Build
        run: npm run build

      - name: Package
        run: npx --no-install electron-builder ${{ matrix.platform }} ${{ matrix.arch }} --publish never

      # Two reasons, either of which is sufficient. macOS auto-update requires a signed
      # app, and these builds are unsigned — so latest-mac.yml describes an update path
      # that cannot work. And the two macOS architectures are built on separate runners,
      # so each produces its own latest-mac.yml and they would silently overwrite one
      # another when the artefacts are merged, leaving a feed that names one arch's dmg
      # for both. Publishing nothing is better than publishing the wrong thing.
      - name: Drop unusable macOS update metadata
        if: runner.os == 'macOS'
        run: rm -f dist/latest-mac.yml dist/*.blockmap

      - uses: actions/upload-artifact@v7
        with:
          name: coffer-${{ matrix.artefact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish release
    needs: build
    # Only a tag push publishes. A workflow_dispatch run reaches this job with
    # `github.ref_name` set to a branch, and `gh release create --verify-tag` would then
    # either fail late or, worse, cut a release named after the branch. A rehearsal ends
    # with the installers attached to the workflow run and nothing on the releases page,
    # which is what a rehearsal should leave behind.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Both for the attestation, and only in this job. `id-token` lets the run ask GitHub
      # for the OIDC token Sigstore signs against; `attestations` stores the result where
      # `gh attestation verify` looks for it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # .nvmrc again — scripts/checksums.mjs runs under this Node.
          node-version-file: .nvmrc

      - name: Collect artefacts
        uses: actions/download-artifact@v8
        with:
          path: artefacts
          pattern: coffer-*
          merge-multiple: true

      # Hashes every file that is about to be attached, so there is no artefact on the
      # release page without a published checksum.
      - name: Generate SHA-256 checksums
        run: node scripts/checksums.mjs artefacts

      # SLSA build provenance for every file about to be attached, SHA256SUMS.txt included:
      # a statement, signed with a certificate only this workflow run could obtain, that the
      # file with this digest came out of this repository's release workflow at this tag.
      # A file put on the release page by any other route fails `gh attestation verify`,
      # even with a checksum line to match it.
      #
      # It is not code signing. Windows SmartScreen and macOS Gatekeeper do not read it, and
      # the installers stay unsigned.
      #
      # Before `gh release create`, so a failed attestation publishes nothing rather than a
      # release whose notes promise one. `actions/attest` rather than
      # `actions/attest-build-provenance`: since v4 the second is a wrapper around the
      # first, and its README sends new workflows to `actions/attest`. With no predicate or
      # SBOM given, it produces build provenance.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artefacts/*

      - name: Compose release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Coffer ${version}"
            echo
            echo "### Verify your download"
            echo
            echo "These builds are **not code-signed** — Windows shows a SmartScreen warning and"
            echo "macOS quarantines the download. See"
            echo "[SECURITY.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/SECURITY.md)."
            echo "Your operating system cannot vouch for them, so please check the file yourself"
            echo "before running the installer: the checksum says it arrived intact."
            echo
            echo "**On Windows 11 with Smart App Control on, the installer will not start at all.**"
            echo "It refuses unsigned files it has no reputation for, and offers no \"Run anyway\"."
            echo "The [README](https://github.com/${GITHUB_REPOSITORY}#getting-past-the-os-check)"
            echo "sets out what you can do about it."
            echo
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt        # Linux'
            echo 'shasum -a 256 -c SHA256SUMS.txt    # macOS'
            echo 'certutil -hashfile <file> SHA256   # Windows, compare by eye'
            echo '```'
            echo
            echo "### Check where it was built"
            echo
            echo "Every file here also has a signed build-provenance attestation. With the"
            echo "[GitHub CLI](https://cli.github.com/) installed and signed in:"
            echo
            # One line, because a backslash continuation is not one in PowerShell or cmd.
            echo '```'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml --source-ref refs/tags/${GITHUB_REF_NAME}"
            echo '```'
            echo
            echo "It passes only for a file this repository's release workflow built from the"
            echo "\`${GITHUB_REF_NAME}\` tag, unchanged since; if it reports an error, do not run the"
            echo "installer. It is not code signing: it does not remove the SmartScreen or Gatekeeper"
            echo "warning, and Smart App Control does not read it either."
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat artefacts/SHA256SUMS.txt
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag such as v1.2.0-beta.1 is a prerelease; v1.2.0 is not.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --title "Coffer $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease \
            artefacts/*
